apiVersion: v1
kind: ConfigMap
metadata:
  name: sports-store-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  sports-store-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {"title": "Explore Sports Store logs", "type": "link", "url": "/explore?left=%7B%22datasource%22:%22loki%22%7D", "targetBlank": false}
      ],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{instance}}", "refId": "A"}],
          "title": "Node CPU utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "{{instance}}", "refId": "A"}],
          "title": "Node memory utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 6},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (phase) (kube_pod_status_phase{namespace=\"sports-store\"} == 1)", "legendFormat": "{{phase}}", "refId": "A"}],
          "title": "Pod health by phase",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 6},
          "id": 4,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"sports-store\"}[15m]))", "legendFormat": "{{pod}}", "refId": "A"}],
          "title": "Container restarts (15m)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0}, "overrides": []},
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 12},
          "id": 5,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {"expr": "kube_deployment_status_replicas_available{namespace=\"sports-store\"}", "legendFormat": "{{deployment}} available", "refId": "A"},
            {"expr": "kube_deployment_spec_replicas{namespace=\"sports-store\"}", "legendFormat": "{{deployment}} desired", "refId": "B"}
          ],
          "title": "Deployment replicas: available versus desired",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 18},
          "id": 6,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (service) (rate(http_requests_total[5m])) or label_replace(sum by (app_kubernetes_io_component) (rate(nginx_http_requests_total{namespace=\"sports-store\"}[5m])), \"service\", \"$1\", \"app_kubernetes_io_component\", \"(.+)\")", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "HTTP request rate by service",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 18},
          "id": 7,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "100 * sum by (service) (rate(http_requests_total{status_code=~\"5..\"}[5m])) / clamp_min(sum by (service) (rate(http_requests_total[5m])), 0.001)", "legendFormat": "{{service}}", "refId": "A"}],
          "title": "HTTP 5xx error rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 18},
          "id": 8,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{service}} p95", "refId": "A"}],
          "title": "HTTP request latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "id": 9,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": true, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"expr": "{namespace=\"sports-store\"}", "queryType": "range", "refId": "A"}],
          "title": "Recent Sports Store logs",
          "type": "logs"
        }
      ],
      "refresh": "1m",
      "schemaVersion": 41,
      "tags": ["sports-store", "diet-mode"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "Sports Store Overview",
      "uid": "sports-store-overview",
      "version": 1
    }
