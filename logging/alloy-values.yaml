# Grafana Alloy chart 1.11.0. A single Deployment uses the Kubernetes logs API
# to cover the small cluster; no host mounts, privileged mode, or per-node Pod
# is required. Collection is restricted to the sports-store namespace.
alloy:
  enableReporting: false
  mounts:
    varlog: false
    dockercontainers: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "json"
      }

      discovery.kubernetes "sports_store_pods" {
        role = "pod"
        namespaces {
          names = ["sports-store"]
        }
      }

      discovery.relabel "sports_store_pods" {
        targets = discovery.kubernetes.sports_store_pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Succeeded|Failed"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "service"
        }
        rule {
          replacement  = "sports-store/pods"
          target_label = "job"
        }
      }

      loki.source.kubernetes "sports_store_pods" {
        targets    = discovery.relabel.sports_store_pods.output
        forward_to = [loki.write.local.receiver]
      }

      loki.source.kubernetes_events "sports_store_events" {
        job_name   = "sports-store/events"
        log_format = "json"
        namespaces = ["sports-store"]
        forward_to = [loki.write.local.receiver]
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: deployment
  replicas: 1
  podDisruptionBudget:
    enabled: false

rbac:
  create: true
  namespaces:
    - sports-store
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["get", "list", "watch"]
  clusterRules: []

configReloader:
  enabled: true
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 25m
      memory: 32Mi

service:
  enabled: true
  type: ClusterIP
serviceMonitor:
  enabled: false
ingress:
  enabled: false
