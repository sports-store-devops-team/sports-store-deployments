fullnameOverride: loki
deploymentMode: Monolithic

loki:
  auth_enabled: false
  image:
    digest: sha256:70b9f699fc9bb868b62f1cfd4f787dfa50242f1fd92e6089787d5d7daea75fe8
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  limits_config:
    allow_structured_metadata: true
    max_cache_freshness_per_query: 10m
    reject_old_samples: true
    reject_old_samples_max_age: 24h
    retention_period: 24h
    split_queries_by_interval: 15m
    volume_enabled: true
  compactor:
    delete_request_store: filesystem
    retention_delete_delay: 2h
    retention_delete_worker_count: 20
    retention_enabled: true
    working_directory: /var/loki/compactor
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  sidecar: false
  automountServiceAccountToken: false
  podDisruptionBudget:
    enabled: false
  persistence:
    enabled: false
    dataVolumeParameters:
      emptyDir:
        sizeLimit: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  service:
    type: ClusterIP

podDisruptionBudget:
  enabled: false

gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
rollout_operator:
  enabled: false
memcached:
  enabled: false
sidecar:
  rules:
    enabled: false
serviceAccount:
  automountServiceAccountToken: false
rbac:
  namespaced: true

# Explicitly keep every unused deployment mode at zero replicas.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
ruler:
  replicas: 0
patternIngester:
  replicas: 0
