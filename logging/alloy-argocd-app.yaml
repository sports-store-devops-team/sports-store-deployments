apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sports-store-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.11.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/logging/alloy-values.yaml
    - repoURL: https://github.com/sports-store-devops-team/sports-store-deployments.git
      targetRevision: NivBranch
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
