{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    {{- include "sports-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.gateway.name }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "sports-store.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.gateway.name }}
  template:
    metadata:
      labels:
        {{- include "sports-store.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.gateway.name }}
    spec:
      serviceAccountName: {{ include "sports-store.serviceAccountName" . }}
      containers:
        - name: gateway
          image: {{ include "sports-store.image" (dict "root" . "repository" .Values.gateway.image.repository "tag" .Values.gateway.image.tag) | quote }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.gateway.readinessProbe.path }}
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: {{ .Values.gateway.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.gateway.livenessProbe.path }}
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: {{ .Values.gateway.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.gateway.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.gateway.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
        {{- if .Values.monitoring.enabled }}
        - name: nginx-exporter
          image: {{ printf "%s:%s" .Values.monitoring.nginxExporter.image.repository .Values.monitoring.nginxExporter.image.tag | quote }}
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status
            - --web.listen-address=:{{ .Values.monitoring.nginxExporter.port }}
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.nginxExporter.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.monitoring.nginxExporter.resources | nindent 12 }}
        {{- end }}
{{- end }}
