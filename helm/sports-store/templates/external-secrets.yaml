{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStoreName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    {{- include "sports-store.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.awsRegion is required when External Secrets is enabled" .Values.externalSecrets.awsRegion }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    {{- include "sports-store.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.externalSecrets.secretStoreName }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        mongodb-root-password: '{{ `{{ .mongodbRootPassword }}` }}'
        JWT_SECRET: '{{ `{{ .jwtSecret }}` }}'
        AUTH_MONGO_URI: '{{ `mongodb://root:{{ .mongodbRootPassword }}@sports-store-mongodb:27017/auth_db?authSource=admin` }}'
        CATALOG_MONGO_URI: '{{ `mongodb://root:{{ .mongodbRootPassword }}@sports-store-mongodb:27017/catalog_db?authSource=admin` }}'
        CART_MONGO_URI: '{{ `mongodb://root:{{ .mongodbRootPassword }}@sports-store-mongodb:27017/cart_db?authSource=admin` }}'
        ORDER_MONGO_URI: '{{ `mongodb://root:{{ .mongodbRootPassword }}@sports-store-mongodb:27017/order_db?authSource=admin` }}'
        PAYMENT_MONGO_URI: '{{ `mongodb://root:{{ .mongodbRootPassword }}@sports-store-mongodb:27017/payment_db?authSource=admin` }}'
  data:
    - secretKey: mongodbRootPassword
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretName }}
        property: MONGODB_ROOT_PASSWORD
    - secretKey: jwtSecret
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretName }}
        property: JWT_SECRET
{{- end }}
